services:
  postgres:
    image: postgres:16-alpine
    container_name: strawb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: strawb-db
      POSTGRES_USER: strawb-user
      POSTGRES_PASSWORD: yourpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy

volumes:
_  postgres_data:

networks:
  proxy:
    external: true