version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: strawb-postgres
    restart: always
    environment:
      POSTGRES_DB: strawb-db
      POSTGRES_USER: strawb-user
      POSTGRES_PASSWORD: yourpassword
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/postgresql/16/bin
      GOSU_VERSION: "1.19"
      LANG: en_US.utf8
      PG_MAJOR: "16"
      PG_VERSION: "16.14-1.pgdg13+1"
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: strawb-backend
    restart: always
    environment:
      DATABASE_URL: postgres://strawb-user:yourpassword@postgres:5432/strawb-db
      PORT: 9000
    ports:
      - "9001:9000"
    depends_on:
      - postgres

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
    container_name: strawb-storefront
    restart: always
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://backend:9000
      PORT: 8000
    ports:
      - "8001:8000"
    depends_on:
      - backend

volumes:
  postgres_data:
