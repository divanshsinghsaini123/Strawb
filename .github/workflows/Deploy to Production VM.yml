name: Deploy to Production VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: SSH to Server and Run Deployment
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          # 1. Latest code pull kar
          cd /home/ubuntu/main/divansh/Strawb
          git pull origin main

          # 2. Latest database backup pick kar & Docker container mein import kar
          echo "🔍 Checking for database backups in apps/postgress..."

          LATEST_BACKUP=""
          # Check apps/postgress/latest.sql first
          if [ -f "apps/postgress/latest.sql" ]; then
            LATEST_BACKUP="apps/postgress/latest.sql"
          # Check apps/postgress/backups/ folder by date
          elif [ -d "apps/postgress/backups" ] && [ -n "$(ls -A apps/postgress/backups/*.sql 2>/dev/null)" ]; then
            LATEST_BACKUP=$(ls -1 apps/postgress/backups/backup_*.sql 2>/dev/null | sort -V | tail -n 1)
          # Fallback: apps/postgress root backups
          elif [ -n "$(ls -A apps/postgress/backup_*.sql 2>/dev/null)" ]; then
            LATEST_BACKUP=$(ls -1 apps/postgress/backup_*.sql 2>/dev/null | sort -V | tail -n 1)
          else
            LATEST_BACKUP=$(ls -1t apps/postgress/*.sql 2>/dev/null | head -n 1)
          fi

          MARKER_FILE="apps/postgress/.last_imported_backup"
          LAST_IMPORTED=""
          if [ -f "$MARKER_FILE" ]; then
            LAST_IMPORTED=$(cat "$MARKER_FILE")
          fi

          if [ -n "$LATEST_BACKUP" ] && [ -f "$LATEST_BACKUP" ]; then
            BACKUP_HASH=$(md5sum "$LATEST_BACKUP" 2>/dev/null | awk '{print $1}')
            CURRENT_ID="${LATEST_BACKUP}_${BACKUP_HASH}"

            if [ "$CURRENT_ID" != "$LAST_IMPORTED" ]; then
              echo "📦 Latest backup found by date: $LATEST_BACKUP"
              echo "🔄 Importing database changes into Docker container (strawb_postgres)..."
              docker exec -i strawb_postgres psql -U strawb-user -d strawb-db < "$LATEST_BACKUP"
              echo "$CURRENT_ID" > "$MARKER_FILE"
              echo "✅ Database import completed successfully!"
            else
              echo "ℹ️ Latest backup ($LATEST_BACKUP) already imported. Skipping database import."
            fi
          else
            echo "ℹ️ No .sql backup file found in apps/postgress. Skipping database import."
          fi

          # 3. Monorepo root dependencies install kar
          echo "⚙️ Installing dependencies..."
          npm install

          # 4. Backend Build & Production Setup (Official Medusa Docs Standard)
          echo "⚙️ Building Medusa backend..."
          cd apps/backend
          npx medusa build
          cd .medusa/server

          # Dependencies install kar build output ke andar (isolated from root workspaces)
          npm install --omit=dev --no-workspaces --no-audit --no-fund

          # Create fresh .env.production & .env inside .medusa/server and copy from apps/backend/.env
          echo "⚙️ Creating fresh .env.production in .medusa/server..."
          touch .env.production .env
          if [ -f "/home/ubuntu/main/divansh/Strawb/apps/backend/.env" ]; then
            cat /home/ubuntu/main/divansh/Strawb/apps/backend/.env > .env.production
            cat /home/ubuntu/main/divansh/Strawb/apps/backend/.env > .env
            echo "✅ Created and populated .env.production and .env from apps/backend/.env"
          elif [ -f "../../.env" ]; then
            cat ../../.env > .env.production
            cat ../../.env > .env
            echo "✅ Created and populated .env.production and .env from ../../.env"
          else
            echo "⚠️ Warning: No backend .env found to copy from!"
          fi

          export NODE_ENV=production
          cd ../../../

          # 5. Medusa Backend ko PM2 par start kar taaki Next.js build ke waqt port 9000 available rahe
          echo "🚀 Starting Medusa backend on PM2..."
          pm2 restart medusa-backend --update-env || pm2 start npm --name "medusa-backend" --cwd /home/ubuntu/main/divansh/Strawb/apps/backend/.medusa/server -- start

          # 6. Backend ke live hone ka intezaar kar (max 180 seconds / 3 minutes)
          echo "⏳ Waiting for Medusa backend to be healthy on port 9000..."
          HEALTHY=0
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/health 2>/dev/null || true)
            if [ "$STATUS" != "200" ]; then
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/store/custom 2>/dev/null || true)
            fi

            if [ "$STATUS" = "200" ]; then
              ELAPSED=$((i * 5))
              echo "✅ Medusa backend is healthy and responding (HTTP 200) after ${ELAPSED}s!"
              HEALTHY=1
              break
            fi
            echo "Waiting for Medusa backend... (attempt $i/60, status: ${STATUS:-unreachable})"
            sleep 5
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "❌ Error: Medusa backend failed to become healthy within 180 seconds (3 minutes)."
            echo "Last 50 lines of backend logs:"
            pm2 logs medusa-backend --lines 50 --nostream
            exit 1
          fi

          # 7. Storefront Build (ab 127.0.0.1:9000 live hai, toh categories fetch ho jayengi)
          echo "⚙️ Building Next.js Storefront..."
          cd apps/storefront
          npm run build
          cd ../../

          # 8. Storefront ko PM2 par restart/start kar
          echo "🔄 Starting Storefront on PM2..."
          pm2 restart storefront || pm2 start npm --name "storefront" --cwd /home/ubuntu/main/divansh/Strawb/apps/storefront -- start
          pm2 save

          # 9. Final PM2 & Service Health Verification (agar koi bhi app down hui toh workflow FAIL mark hoga)
          echo "🔍 Verifying all PM2 services and health..."
          sleep 5

          # PM2 process table display kar
          pm2 list

          FAILED=0

          # Check if medusa-backend process status is 'online' in PM2
          MEDUSA_STATUS=$(pm2 jlist | jq -r '.[] | select(.name=="medusa-backend") | .pm2_env.status' 2>/dev/null || pm2 show medusa-backend | grep -i "status" | awk '{print $4}')
          if [[ "$MEDUSA_STATUS" != *"online"* ]]; then
            echo "❌ ERROR: 'medusa-backend' is NOT online in PM2 (status: $MEDUSA_STATUS)!"
            pm2 logs medusa-backend --lines 30 --nostream
            FAILED=1
          else
            echo "✅ 'medusa-backend' is online in PM2."
          fi

          # Check if storefront process status is 'online' in PM2
          STOREFRONT_STATUS=$(pm2 jlist | jq -r '.[] | select(.name=="storefront") | .pm2_env.status' 2>/dev/null || pm2 show storefront | grep -i "status" | awk '{print $4}')
          if [[ "$STOREFRONT_STATUS" != *"online"* ]]; then
            echo "❌ ERROR: 'storefront' is NOT online in PM2 (status: $STOREFRONT_STATUS)!"
            pm2 logs storefront --lines 30 --nostream
            FAILED=1
          else
            echo "✅ 'storefront' is online in PM2."
          fi

          # HTTP check on both services
          MEDUSA_HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/health 2>/dev/null || true)
          if [ "$MEDUSA_HTTP" != "200" ]; then
            MEDUSA_HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/store/custom 2>/dev/null || true)
          fi

          if [ "$MEDUSA_HTTP" != "200" ]; then
            echo "❌ ERROR: Medusa backend HTTP health check failed on port 9000 (status: $MEDUSA_HTTP)!"
            FAILED=1
          else
            echo "✅ Medusa backend HTTP check passed (HTTP 200)."
          fi

          if ! curl -s -o /dev/null http://127.0.0.1:8000 2>/dev/null; then
            echo "❌ ERROR: Storefront HTTP check failed on port 8000!"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "💥 Deployment FAILED: One or more services are down or unhealthy!"
            exit 1
          fi

          echo "🎉 All services are online and healthy! Deployment successful!"
